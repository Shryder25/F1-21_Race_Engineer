name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # test_hud.py runs the HUD's browser script under Node.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Only numpy is needed for tests. Voice, mic and audio packages are optional at
      # runtime and need system audio libraries the runner doesn't have.
      - name: Install dependencies
        run: python -m pip install --upgrade pip "numpy>=1.26"

      - name: Run unit tests
        working-directory: tests
        run: python -m unittest discover -v
