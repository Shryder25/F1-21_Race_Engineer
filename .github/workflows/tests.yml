name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # test_hud.py runs the HUD's browser script under Node.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Only numpy and pyarrow (channel store) are needed for tests. Voice, mic and audio
      # packages are optional at runtime and need system audio libraries the runner doesn't have.
      # ruff and mypy are pinned to the versions in pyproject.toml's dev extra.
      - name: Install dependencies
        id: install
        run: python -m pip install --upgrade pip "numpy>=1.26" "pyarrow>=14" "ruff==0.16.9" "mypy==2.3.1"

      # Lint and type checks are part of the required `tests` check: any error fails it.
      # Each step still runs when an earlier one failed, so one push shows every problem.
      # Settings live in pyproject.toml ([tool.ruff], [tool.mypy]).
      - name: Lint (ruff check)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff check --output-format=github .

      - name: Format (ruff format --check)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff format --check --diff .

      - name: Type check (mypy --strict on the pipeline)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mypy

      - name: Run unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: tests
        run: python -m unittest discover -v
