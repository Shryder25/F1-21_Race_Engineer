# Fly.io: `fly launch --no-deploy` (keep this file), then see docs/cloud-deployment.md.
app = "f1-race-engineer"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  CLOUD_MODE = "1"
  DATA_DIR = "/data"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # One always-on machine: the HUD state lives in memory and the relay holds a long
  # WebSocket, so don't let Fly stop or scale it.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[mounts]
  source = "engineer_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
